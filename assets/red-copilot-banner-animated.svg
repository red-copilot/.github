<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Red Copilot — Animated Security Engineering Banner</title>
  <desc id="desc">Dark engineering grid, animated radar sweep, and a moving signal pulse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050506"/><stop offset=".55" stop-color="#09090c"/><stop offset="1" stop-color="#170407"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6565"/><stop offset=".55" stop-color="#ff2d2d"/><stop offset="1" stop-color="#861313"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff2d2d" stop-opacity=".22"/><stop offset="1" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7f1d1d" stroke-opacity=".16"/></pattern>
    <clipPath id="frame"><rect width="1600" height="480" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="480" fill="url(#bg)"/><rect width="1600" height="480" fill="url(#grid)"/>
    <circle cx="1270" cy="238" r="320" fill="url(#glow)"/>
    <path d="M0 72H1600M0 386H1600M68 0V480M1532 0V480" fill="none" stroke="#27272a"/>
    <g fill="none" stroke="#ef4444">
      <circle cx="1264" cy="238" r="168" stroke-opacity=".2"/>
      <circle cx="1264" cy="238" r="118" stroke-opacity=".32"/>
      <circle cx="1264" cy="238" r="64" stroke-opacity=".5"/>
      <circle cx="1264" cy="238" r="238" stroke-opacity=".24" stroke-dasharray="3 11">
        <animateTransform attributeName="transform" type="rotate" from="0 1264 238" to="360 1264 238" dur="36s" repeatCount="indefinite"/>
      </circle>
      <path d="M1264 40V124M1264 352V436M1066 238H1150M1378 238H1462" stroke-opacity=".38"/>
      <path d="M1079 53L1180 154M1348 322L1449 423M1449 53L1348 154M1180 322L1079 423" stroke-opacity=".18"/>
    </g>
    <path d="M1128 102L1400 374" stroke="#ff2d2d" stroke-opacity=".0" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0;.65;0" dur="4.8s" repeatCount="indefinite"/>
    </path>
    <g stroke="url(#signal)" stroke-linecap="round"><path d="M1177 151L1351 325" stroke-width="18"/><path d="M1351 151L1177 325" stroke-width="18"/></g>
    <g stroke="#fff5f5" stroke-linecap="round" stroke-opacity=".88"><path d="M1264 208V268" stroke-width="4"/><path d="M1234 238H1294" stroke-width="4"/></g>
    <circle cx="1264" cy="238" r="13" fill="#fff5f5"><animate attributeName="r" values="11;15;11" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1264" cy="238" r="6" fill="#ff2d2d"/>
    <g fill="#ff4d4d">
      <circle cx="1088" cy="127" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="1434" cy="109" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1406" cy="365" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="342" r="3"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke="#ff4d4d" stroke-opacity=".32"><path d="M1088 127L1160 185M1434 109L1354 166M1406 365L1334 307M1110 342L1180 288"/></g>
    <g font-family="Arial,Helvetica,sans-serif">
      <rect x="68" y="104" width="10" height="10" fill="#ff2d2d"/>
      <text x="94" y="114" fill="#d4d4d8" font-size="15" font-weight="700" letter-spacing="4.4">RED COPILOT</text>
      <text x="478" y="114" fill="#71717a" font-size="13" font-weight="700" letter-spacing="2.6">AI-NATIVE SECURITY ENGINEERING</text>
      <text x="68" y="224" fill="#fafafa" font-size="94" font-weight="800" letter-spacing="-3">AI</text>
      <text x="184" y="225" fill="#ff3b3b" font-size="108" font-weight="500">×</text>
      <text x="300" y="224" fill="#fafafa" font-size="76" font-weight="800" letter-spacing="-1.5">OFFENSIVE</text>
      <text x="300" y="312" fill="#fafafa" font-size="76" font-weight="800" letter-spacing="-1.5">SECURITY</text>
      <text x="72" y="363" fill="#a1a1aa" font-size="17" letter-spacing="1.4">AUTONOMOUS AGENTS · ISOLATED EXECUTION · VERIFIED OUTCOMES</text>
      <text x="1264" y="438" text-anchor="middle" fill="#71717a" font-size="12" font-weight="700" letter-spacing="3.2">CONTROL THE LOOP</text>
      <g font-size="13" font-weight="700" letter-spacing="1.7">
        <text x="72" y="442" fill="#ff5a5a">01</text><text x="104" y="442" fill="#d4d4d8">AUTONOMY</text>
        <text x="252" y="442" fill="#ff5a5a">02</text><text x="284" y="442" fill="#d4d4d8">TRUST BOUNDARY</text>
        <text x="486" y="442" fill="#ff5a5a">03</text><text x="518" y="442" fill="#d4d4d8">ATTACK SURFACE</text>
      </g>
    </g>
    <path d="M1532 92V388M1510 118L1532 96L1554 118" fill="none" stroke="#ff2d2d" stroke-opacity=".42"/>
    <path d="M70 74H340" stroke="#ff2d2d" stroke-width="2" stroke-opacity=".7">
      <animate attributeName="stroke-opacity" values=".25;.9;.25" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>